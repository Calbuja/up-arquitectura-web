# =============================================================================
# Contrato de la API del Taller Mecanico - Especificacion OpenAPI 3.0.3
#
# Actividad individual de documentacion de API - Modulo 2
# Arquitectura Web - Universidad de Palermo
# Cristian Albuja - Legajo 0144050
#
# Como visualizarlo:
#   1. Abrir https://editor.swagger.io
#   2. File -> Import file -> seleccionar este archivo
#   3. Queda la documentacion navegable, con la posibilidad de probar cada
#      endpoint contra el servidor local
#
# Cada status code declarado aca fue verificado provocandolo con un request real
# contra la implementacion. Los casos quedaron como suite automatizada en el codigo
# del backend (tests/contrato-api.test.js), que se incorporara a este repositorio
# junto con el Trabajo Practico Integrador.
# =============================================================================

openapi: 3.0.3

info:
  title: Taller API
  version: 1.0.0
  description: |
    API RESTful para la gestion de un taller mecanico.

    Administra las unidades que atiende el taller (**vehiculos**) y las
    **ordenes de trabajo** que se abren sobre ellas, con sus repuestos y mano de
    obra, y deriva de esos datos un conjunto de **reportes** de gestion.

    ## Nivel de madurez

    La API cumple el **Nivel 2 del Modelo de Madurez de Richardson**: expone
    recursos identificados por URI y usa los verbos HTTP y los status codes
    segun su semantica.

    ## Formato de error

    Todos los errores, sea cual sea el status code, responden con la misma
    estructura `{ error: { code, message, details } }`, para que el cliente
    pueda manejarlos de forma generica.

    ## Paginacion

    Todos los listados aceptan `page` (desde 1, default 1) y `limit`
    (1 a 100, default 20), y devuelven un bloque `meta` con el total.
  contact:
    name: Cristian Albuja
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt

servers:
  - url: http://localhost:3001/api/v1
    description: Servidor local de desarrollo

# La API no implementa autenticacion: el enunciado del TP la declara opcional.
# Declararlo explicitamente con una lista vacia es distinto de omitir el campo:
# omitirlo deja el contrato ambiguo, mientras que `security: []` afirma que
# ningun endpoint requiere credenciales.
security: []

tags:
  - name: Servicio
    description: Endpoints de descubrimiento y diagnostico
  - name: Vehiculos
    description: Recurso maestro. Expone el ABM completo
  - name: Ordenes de trabajo
    description: Recurso transaccional, con ciclo de vida propio
  - name: Items
    description: Sub-recurso de una orden de trabajo
  - name: Reportes
    description: Recursos derivados, de solo lectura

# =============================================================================
paths:
# =============================================================================

  # --------------------------------------------------------------------------
  /:
    get:
      tags: [Servicio]
      summary: Indice de la API
      description: Lista los recursos disponibles con su URI, para poder navegar la API sin leer la documentacion.
      operationId: obtenerIndice
      responses:
        '200':
          description: Indice devuelto correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  nombre: { type: string, example: Taller API }
                  version: { type: string, example: 1.0.0 }
                  descripcion: { type: string }
                  recursos: { type: object }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

  # --------------------------------------------------------------------------
  /health:
    get:
      tags: [Servicio]
      summary: Chequeo de salud
      description: Verifica que el servidor este operativo y confirma que el set de datos por defecto se cargo.
      operationId: obtenerHealth
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }
                  entorno: { type: string, example: development }
                  uptimeSegundos: { type: integer, example: 42 }
                  datosCargados:
                    type: object
                    properties:
                      vehiculos: { type: integer, example: 8 }
                      ordenes: { type: integer, example: 10 }
                  timestamp: { type: string, format: date-time }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

  # --------------------------------------------------------------------------
  /vehiculos:
    get:
      tags: [Vehiculos]
      summary: Listar vehiculos
      description: Devuelve la coleccion de vehiculos del taller, con filtros, ordenamiento y paginacion.
      operationId: listarVehiculos
      parameters:
        - name: q
          in: query
          description: Busqueda libre sobre patente, marca, modelo y titular
          schema: { type: string }
          example: corolla
        - name: marca
          in: query
          description: Filtra por marca exacta, sin distinguir mayusculas
          schema: { type: string }
          example: Toyota
        - name: activo
          in: query
          description: Filtra por estado de alta
          schema: { type: boolean }
        - name: sort
          in: query
          description: Campo de ordenamiento. Prefijar con `-` para descendente
          schema:
            type: string
            default: patente
            enum: [patente, -patente, marca, -marca, modelo, -modelo, anio, -anio, kilometraje, -kilometraje, id, -id]
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Listado devuelto correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Vehiculo' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

    post:
      tags: [Vehiculos]
      summary: Dar de alta un vehiculo
      description: Crea un vehiculo nuevo. La patente es la clave natural y debe ser unica en todo el sistema.
      operationId: crearVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiculoInput' }
            example:
              patente: AZ999ZZ
              marca: Honda
              modelo: Civic
              anio: 2020
              kilometraje: 54000
              titularNombre: Carla Nunez
              titularTelefono: 11-1234-5678
      responses:
        '201':
          description: Vehiculo creado
          headers:
            Location:
              description: URI del recurso recien creado
              schema: { type: string, example: /api/v1/vehiculos/9 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '409':
          description: Ya existe un vehiculo con esa patente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { code: CONFLICT, message: "Ya existe un vehiculo con la patente 'AB123CD'", details: [] }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }
        '413': { $ref: '#/components/responses/PayloadDemasiadoGrande' }
        '415': { $ref: '#/components/responses/MediaTypeNoSoportado' }

  # --------------------------------------------------------------------------
  /vehiculos/{id}:
    parameters:
      - { $ref: '#/components/parameters/VehiculoId' }

    get:
      tags: [Vehiculos]
      summary: Obtener un vehiculo
      description: Devuelve la representacion completa de un vehiculo identificado por su id.
      operationId: obtenerVehiculo
      responses:
        '200':
          description: Vehiculo encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

    put:
      tags: [Vehiculos]
      summary: Reemplazar un vehiculo
      description: |
        Reemplaza la representacion completa del vehiculo. El cliente debe enviar
        **todos** los campos obligatorios: se validan con las mismas reglas que el alta.
        Es idempotente.
      operationId: reemplazarVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiculoInput' }
            example:
              patente: AB123CD
              marca: Toyota
              modelo: Corolla XEI
              anio: 2019
              kilometraje: 90000
              titularNombre: Laura Gimenez
              titularTelefono: 11-4455-8890
              activo: true
      responses:
        '200':
          description: Vehiculo reemplazado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoVehiculo' }
        '413': { $ref: '#/components/responses/PayloadDemasiadoGrande' }
        '415': { $ref: '#/components/responses/MediaTypeNoSoportado' }

    patch:
      tags: [Vehiculos]
      summary: Modificar parcialmente un vehiculo
      description: Aplica unicamente los campos enviados y conserva el resto. El body no puede venir vacio.
      operationId: modificarVehiculo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiculoPatch' }
            examples:
              actualizarKilometraje:
                summary: Actualizar solo el kilometraje
                value: { kilometraje: 92000 }
              bajaLogica:
                summary: Baja logica sin borrar el registro
                value: { activo: false }
      responses:
        '200':
          description: Vehiculo modificado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehiculo' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/ConflictoVehiculo' }
        '413': { $ref: '#/components/responses/PayloadDemasiadoGrande' }
        '415': { $ref: '#/components/responses/MediaTypeNoSoportado' }

    delete:
      tags: [Vehiculos]
      summary: Eliminar un vehiculo
      description: |
        Elimina el vehiculo junto con sus ordenes historicas. Se bloquea si tiene
        ordenes abiertas: borrarlo dejaria ordenes apuntando a un vehiculo inexistente.
        Es idempotente.
      operationId: eliminarVehiculo
      responses:
        '204': { description: Vehiculo eliminado. Sin cuerpo de respuesta }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El vehiculo tiene ordenes de trabajo abiertas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # --------------------------------------------------------------------------
  /vehiculos/{id}/ordenes:
    parameters:
      - { $ref: '#/components/parameters/VehiculoId' }

    get:
      tags: [Vehiculos]
      summary: Historial de ordenes de un vehiculo
      description: Devuelve todas las ordenes del vehiculo, de la mas reciente a la mas antigua.
      operationId: listarOrdenesDeVehiculo
      responses:
        '200':
          description: Historial devuelto correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Orden' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer, example: 2 }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

  # --------------------------------------------------------------------------
  /ordenes:
    get:
      tags: [Ordenes de trabajo]
      summary: Listar ordenes de trabajo
      description: |
        Devuelve la coleccion de ordenes con filtros, ordenamiento y paginacion.
        Cada orden viene enriquecida con los datos basicos de su vehiculo, para
        que una grilla no tenga que hacer una request por fila.
      operationId: listarOrdenes
      parameters:
        - name: estado
          in: query
          description: Uno o varios estados separados por coma
          schema: { type: string }
          example: PENDIENTE,EN_PROCESO
        - name: vehiculoId
          in: query
          description: Filtra por vehiculo
          schema: { type: integer }
        - name: mecanico
          in: query
          description: Coincidencia parcial sobre el nombre del mecanico
          schema: { type: string }
        - name: desde
          in: query
          description: Limite inferior del rango sobre la fecha de ingreso
          schema: { type: string, format: date }
          example: '2026-01-01'
        - name: hasta
          in: query
          description: Limite superior del rango sobre la fecha de ingreso
          schema: { type: string, format: date }
          example: '2026-12-31'
        - name: sort
          in: query
          schema:
            type: string
            default: '-fechaIngreso'
            enum: [id, -id, numero, -numero, fechaIngreso, -fechaIngreso, estado, -estado, total, -total, mecanico, -mecanico]
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Listado devuelto correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Orden' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

    post:
      tags: [Ordenes de trabajo]
      summary: Abrir una orden de trabajo
      description: |
        Crea una orden sobre un vehiculo activo. **Toda orden nace en `PENDIENTE`**:
        el estado no se acepta desde el cliente, solo puede avanzar por
        `PUT /ordenes/{id}/estado`.
      operationId: crearOrden
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdenInput' }
            example:
              vehiculoId: 1
              descripcion: Cambio de correa de distribucion y tensor
              mecanico: Ruben Paz
              kilometrajeIngreso: 95000
      responses:
        '201':
          description: Orden creada
          headers:
            Location:
              description: URI del recurso recien creado
              schema: { type: string, example: /api/v1/ordenes/11 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400':
          description: Datos invalidos, o el vehiculo referenciado no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: VALIDATION_ERROR
                  message: La solicitud contiene datos invalidos
                  details: [{ campo: vehiculoId, mensaje: "No existe un vehiculo con id '9999'" }]
        '409':
          description: El vehiculo esta dado de baja, o el kilometraje de ingreso es menor al registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }
        '413': { $ref: '#/components/responses/PayloadDemasiadoGrande' }
        '415': { $ref: '#/components/responses/MediaTypeNoSoportado' }

  # --------------------------------------------------------------------------
  /ordenes/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrdenId' }

    get:
      tags: [Ordenes de trabajo]
      summary: Obtener una orden de trabajo
      description: Devuelve la orden con todos sus items y el total calculado a partir de ellos.
      operationId: obtenerOrden
      responses:
        '200':
          description: Orden encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

    patch:
      tags: [Ordenes de trabajo]
      summary: Modificar una orden de trabajo
      description: |
        Modifica la descripcion y/o el mecanico. Solo se admite mientras la orden
        este abierta.

        Este recurso **no expone `PUT`** a proposito: la orden tiene campos que el
        cliente no puede fijar (`numero`, `estado`, fechas, `total`), y un reemplazo
        completo daria a entender que se pueden enviar todos.
      operationId: modificarOrden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                descripcion: { type: string, minLength: 5, maxLength: 300 }
                mecanico: { type: string, minLength: 3, maxLength: 80 }
            example: { descripcion: Revision general del motor }
      responses:
        '200':
          description: Orden modificada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La orden esta cerrada o cancelada y ya no admite cambios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadDemasiadoGrande' }
        '415': { $ref: '#/components/responses/MediaTypeNoSoportado' }

    delete:
      tags: [Ordenes de trabajo]
      summary: Eliminar una orden de trabajo
      description: |
        Elimina una orden abierta o cancelada. Las cerradas forman el historial
        facturado que alimenta los reportes y no pueden borrarse.
      operationId: eliminarOrden
      responses:
        '204': { description: Orden eliminada. Sin cuerpo de respuesta }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La orden esta cerrada y forma parte del historial facturado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # --------------------------------------------------------------------------
  /ordenes/{id}/estado:
    parameters:
      - { $ref: '#/components/parameters/OrdenId' }

    put:
      tags: [Ordenes de trabajo]
      summary: Cambiar el estado de una orden
      description: |
        Aplica una transicion respetando la maquina de estados:

            PENDIENTE  -->  EN_PROCESO  -->  CERRADA    (final)
                |               |
                +---------------+------->  CANCELADA    (final)

        El estado se modela como **sub-recurso propio** y no como un campo mas del
        `PATCH`, porque cambiarlo dispara efectos de negocio: valida la transicion,
        exige que la orden tenga items para poder cerrarse, y actualiza el
        kilometraje del vehiculo al cerrar.

        Es `PUT` y no `POST` porque la operacion fija el estado a un valor
        determinado: es idempotente en su intencion.
      operationId: cambiarEstadoOrden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [PENDIENTE, EN_PROCESO, CERRADA, CANCELADA]
            example: { estado: EN_PROCESO }
      responses:
        '200':
          description: Transicion aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orden' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Transicion invalida, la orden ya esta en ese estado, o se intenta cerrar sin items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: CONFLICT
                  message: 'Transicion invalida: una orden en estado PENDIENTE no puede pasar a CERRADA'
                  details: []
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }
        '415': { $ref: '#/components/responses/MediaTypeNoSoportado' }

  # --------------------------------------------------------------------------
  /ordenes/{id}/items:
    parameters:
      - { $ref: '#/components/parameters/OrdenId' }

    get:
      tags: [Items]
      summary: Listar los items de una orden
      description: Devuelve los repuestos y las tareas de mano de obra cargados en la orden.
      operationId: listarItems
      responses:
        '200':
          description: Items devueltos correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer, example: 4 }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

    post:
      tags: [Items]
      summary: Agregar un item a una orden
      description: |
        Agrega un repuesto o una tarea de mano de obra. El `subtotal` del item y el
        `total` de la orden se recalculan solos: nunca se almacenan.
      operationId: agregarItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
            examples:
              repuesto:
                summary: Un repuesto
                value: { tipo: REPUESTO, descripcion: Kit de distribucion, cantidad: 1, precioUnitario: 195000 }
              manoDeObra:
                summary: Mano de obra por hora
                value: { tipo: MANO_DE_OBRA, descripcion: Mano de obra distribucion (hora), cantidad: 5, precioUnitario: 32000 }
      responses:
        '201':
          description: Item agregado
          headers:
            Location:
              description: URI del item dentro de su orden
              schema: { type: string, example: /api/v1/ordenes/8/items/1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La orden esta cerrada o cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadDemasiadoGrande' }
        '415': { $ref: '#/components/responses/MediaTypeNoSoportado' }

  # --------------------------------------------------------------------------
  /ordenes/{id}/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/OrdenId' }
      - name: itemId
        in: path
        required: true
        description: Identificador del item, unico dentro de su orden
        schema: { type: integer, minimum: 1 }
        example: 1

    delete:
      tags: [Items]
      summary: Quitar un item de una orden
      description: Quita el item y recalcula el total de la orden. Es idempotente.
      operationId: quitarItem
      responses:
        '204': { description: Item quitado. Sin cuerpo de respuesta }
        '404':
          description: La orden o el item no existen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: La orden esta cerrada o cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

  # --------------------------------------------------------------------------
  /reportes/resumen:
    get:
      tags: [Reportes]
      summary: Indicadores generales del taller
      description: |
        Devuelve facturacion total, ticket promedio, ordenes por estado y conteo de
        vehiculos. Solo las ordenes `CERRADA` cuentan como facturacion.
      operationId: reporteResumen
      responses:
        '200':
          description: Reporte calculado
          headers:
            Cache-Control:
              description: Siempre `no-store`, el reporte se recalcula en cada request
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehiculos:
                    type: object
                    properties:
                      total: { type: integer, example: 8 }
                      activos: { type: integer, example: 7 }
                      inactivos: { type: integer, example: 1 }
                  ordenes:
                    type: object
                    properties:
                      total: { type: integer, example: 10 }
                      abiertas: { type: integer, example: 3 }
                      porEstado: { type: object }
                  facturacion:
                    type: object
                    properties:
                      total: { type: number, example: 1694400 }
                      ordenesFacturadas: { type: integer, example: 6 }
                      ticketPromedio: { type: number, example: 282400 }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

  # --------------------------------------------------------------------------
  /reportes/facturacion-mensual:
    get:
      tags: [Reportes]
      summary: Facturacion agrupada por mes
      description: |
        Devuelve **siempre los doce meses**, incluidos los que no tuvieron
        movimiento: un grafico con meses faltantes miente sobre la tendencia.
      operationId: reporteFacturacionMensual
      parameters:
        - name: anio
          in: query
          description: Anio a reportar. Por defecto, el anio en curso
          schema: { type: integer, minimum: 2000, maximum: 2027 }
          example: 2026
      responses:
        '200':
          description: Reporte calculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    minItems: 12
                    maxItems: 12
                    items:
                      type: object
                      properties:
                        mes: { type: integer, example: 1 }
                        nombre: { type: string, example: Enero }
                        ordenes: { type: integer, example: 1 }
                        total: { type: number, example: 178600 }
                        promedio: { type: number, example: 178600 }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

  # --------------------------------------------------------------------------
  /reportes/costos-por-vehiculo:
    get:
      tags: [Reportes]
      summary: Costo de mantenimiento por vehiculo
      description: |
        Historial facturado de cada unidad, discriminado entre repuestos y mano de
        obra, ordenado de mayor a menor.
      operationId: reporteCostosPorVehiculo
      parameters:
        - name: limit
          in: query
          description: Top N vehiculos. Por defecto se devuelven todos
          schema: { type: integer, minimum: 1, maximum: 100 }
          example: 10
      responses:
        '200':
          description: Reporte calculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      type: object
                      properties:
                        vehiculoId: { type: integer }
                        patente: { type: string }
                        descripcion: { type: string }
                        titular: { type: string }
                        kilometraje: { type: integer }
                        ordenesCerradas: { type: integer }
                        ordenesAbiertas: { type: integer }
                        totalRepuestos: { type: number }
                        totalManoDeObra: { type: number }
                        totalFacturado: { type: number }
                        promedioPorOrden: { type: number }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

  # --------------------------------------------------------------------------
  /reportes/service-vencido:
    get:
      tags: [Reportes]
      summary: Unidades con el service vencido
      description: |
        Vehiculos **activos** que recorrieron mas de `umbralKm` desde su ultima
        orden cerrada. Un vehiculo que nunca ingreso se mide contra su kilometraje
        total y se marca con `nuncaIngreso: true`.
      operationId: reporteServiceVencido
      parameters:
        - name: umbralKm
          in: query
          description: Kilometros entre services
          schema: { type: integer, minimum: 1000, maximum: 100000, default: 10000 }
          example: 10000
      responses:
        '200':
          description: Reporte calculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos:
                    type: array
                    items:
                      type: object
                      properties:
                        vehiculoId: { type: integer }
                        patente: { type: string }
                        descripcion: { type: string }
                        titular: { type: string }
                        telefono: { type: string }
                        kilometraje: { type: integer }
                        ultimoServiceFecha: { type: string, format: date-time, nullable: true }
                        ultimoServiceKm: { type: integer, nullable: true }
                        kmDesdeUltimoService: { type: integer }
                        kmExcedidos: { type: integer }
                        nuncaIngreso: { type: boolean }
                        vencido: { type: boolean }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '405': { $ref: '#/components/responses/MetodoNoPermitido' }

# =============================================================================
components:
# =============================================================================

  parameters:

    Page:
      name: page
      in: query
      description: Numero de pagina, desde 1
      schema: { type: integer, minimum: 1, default: 1 }

    Limit:
      name: limit
      in: query
      description: Cantidad de resultados por pagina
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    VehiculoId:
      name: id
      in: path
      required: true
      description: Identificador del vehiculo
      schema: { type: integer, minimum: 1 }
      example: 1

    OrdenId:
      name: id
      in: path
      required: true
      description: Identificador de la orden de trabajo
      schema: { type: integer, minimum: 1 }
      example: 1

  # ---------------------------------------------------------------------------
  schemas:

    Vehiculo:
      type: object
      description: Representacion de un vehiculo tal como la devuelve la API
      properties:
        id: { type: integer, example: 1 }
        patente: { type: string, example: AB123CD }
        marca: { type: string, example: Toyota }
        modelo: { type: string, example: Corolla }
        anio: { type: integer, example: 2019 }
        kilometraje: { type: integer, example: 87500 }
        titular:
          type: object
          properties:
            nombre: { type: string, example: Laura Gimenez }
            telefono: { type: string, example: 11-4455-8890 }
        activo: { type: boolean, example: true }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    VehiculoInput:
      type: object
      description: Cuerpo esperado en el alta (POST) y en el reemplazo completo (PUT)
      required: [patente, marca, modelo, anio, kilometraje, titularNombre, titularTelefono]
      additionalProperties: false
      properties:
        patente:
          type: string
          description: Formato argentino, viejo (AAA111) o Mercosur (AB123CD). Se normaliza a mayusculas
          pattern: '^([A-Za-z]{3}[0-9]{3}|[A-Za-z]{2}[0-9]{3}[A-Za-z]{2})$'
          example: AZ999ZZ
        marca: { type: string, minLength: 2, maxLength: 40, example: Honda }
        modelo: { type: string, minLength: 1, maxLength: 40, example: Civic }
        anio: { type: integer, minimum: 1950, maximum: 2027, example: 2020 }
        kilometraje:
          type: integer
          description: No puede disminuir respecto del valor ya registrado
          minimum: 0
          maximum: 2000000
          example: 54000
        titularNombre: { type: string, minLength: 3, maxLength: 80, example: Carla Nunez }
        titularTelefono: { type: string, minLength: 6, maxLength: 30, example: 11-1234-5678 }
        activo: { type: boolean, default: true }

    VehiculoPatch:
      type: object
      description: Cuerpo esperado en la modificacion parcial (PATCH). Al menos una propiedad
      minProperties: 1
      additionalProperties: false
      properties:
        patente: { type: string, pattern: '^([A-Za-z]{3}[0-9]{3}|[A-Za-z]{2}[0-9]{3}[A-Za-z]{2})$' }
        marca: { type: string, minLength: 2, maxLength: 40 }
        modelo: { type: string, minLength: 1, maxLength: 40 }
        anio: { type: integer, minimum: 1950, maximum: 2027 }
        kilometraje: { type: integer, minimum: 0, maximum: 2000000 }
        titularNombre: { type: string, minLength: 3, maxLength: 80 }
        titularTelefono: { type: string, minLength: 6, maxLength: 30 }
        activo: { type: boolean }

    Orden:
      type: object
      description: Representacion de una orden de trabajo
      properties:
        id: { type: integer, example: 1 }
        numero:
          type: string
          description: Numero de negocio legible, distinto del id tecnico
          example: OT-2026-0001
        vehiculoId: { type: integer, example: 1 }
        descripcion: { type: string, example: 'Service de 80.000 km: aceite, filtros y bujias' }
        estado:
          type: string
          enum: [PENDIENTE, EN_PROCESO, CERRADA, CANCELADA]
          example: CERRADA
        mecanico: { type: string, example: Ruben Paz }
        kilometrajeIngreso: { type: integer, example: 80100 }
        fechaIngreso: { type: string, format: date-time }
        fechaCierre: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        cantidadItems: { type: integer, example: 4 }
        total:
          type: number
          description: Calculado como la suma de los subtotales. Nunca se almacena
          example: 178600
        vehiculo:
          type: object
          nullable: true
          description: Datos basicos del vehiculo, incluidos para evitar una request por fila
          properties:
            id: { type: integer }
            patente: { type: string }
            marca: { type: string }
            modelo: { type: string }

    OrdenInput:
      type: object
      description: Cuerpo esperado al abrir una orden. El estado no se acepta del cliente
      required: [vehiculoId, descripcion, mecanico, kilometrajeIngreso]
      additionalProperties: false
      properties:
        vehiculoId:
          type: integer
          description: Debe existir y estar activo
          minimum: 1
          example: 1
        descripcion: { type: string, minLength: 5, maxLength: 300, example: Cambio de correa de distribucion y tensor }
        mecanico: { type: string, minLength: 3, maxLength: 80, example: Ruben Paz }
        kilometrajeIngreso:
          type: integer
          description: No puede ser menor al kilometraje actual del vehiculo
          minimum: 0
          maximum: 2000000
          example: 95000

    Item:
      type: object
      description: Repuesto colocado o tarea de mano de obra dentro de una orden
      properties:
        id:
          type: integer
          description: Unico dentro de su orden, no globalmente
          example: 1
        tipo: { type: string, enum: [REPUESTO, MANO_DE_OBRA], example: REPUESTO }
        descripcion: { type: string, example: Filtro de aceite }
        cantidad: { type: integer, example: 1 }
        precioUnitario: { type: number, example: 18400 }
        subtotal:
          type: number
          description: Calculado como cantidad x precioUnitario. Nunca se almacena
          example: 18400

    ItemInput:
      type: object
      required: [tipo, descripcion, cantidad, precioUnitario]
      additionalProperties: false
      properties:
        tipo: { type: string, enum: [REPUESTO, MANO_DE_OBRA] }
        descripcion: { type: string, minLength: 3, maxLength: 150 }
        cantidad: { type: integer, minimum: 1, maximum: 999 }
        precioUnitario: { type: number, minimum: 0, maximum: 100000000 }

    Meta:
      type: object
      description: Metadata de paginacion que acompana a toda respuesta de coleccion
      properties:
        total: { type: integer, example: 8 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPaginas: { type: integer, example: 1 }
        hayPaginaSiguiente: { type: boolean, example: false }

    Error:
      type: object
      description: Forma unica de error, compartida por todos los status code de la API
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Identificador estable, pensado para que el cliente ramifique sobre el
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - NOT_FOUND
                - ROUTE_NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - INTERNAL_SERVER_ERROR
            message: { type: string, description: Mensaje legible para una persona }
            details:
              type: array
              description: Detalle campo por campo. Vacio salvo en errores de validacion
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensaje: { type: string }

  # ---------------------------------------------------------------------------
  responses:

    ErrorValidacion:
      description: Datos, query params o campos desconocidos invalidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: La solicitud contiene datos invalidos
              details:
                - { campo: patente, mensaje: "'patente' no tiene un formato valido (AAA111 o AB123CD)" }
                - { campo: anio, mensaje: "'anio' debe estar entre 1950 y 2027" }

    ConflictoVehiculo:
      description: |
        El request es valido pero choca con el estado actual: la patente ya
        pertenece a otro vehiculo, o el kilometraje intenta retroceder
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            patenteDuplicada:
              summary: La patente pertenece a otro vehiculo
              value:
                error: { code: CONFLICT, message: "Ya existe un vehiculo con la patente 'AC456EF'", details: [] }
            kilometrajeRetrocede:
              summary: El kilometraje no puede disminuir
              value:
                error: { code: CONFLICT, message: 'El kilometraje no puede disminuir (actual: 92000 km, recibido: 100 km)', details: [] }

    NoEncontrado:
      description: El recurso identificado en la URI no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: NOT_FOUND, message: "Vehiculo con id '9999' no encontrado", details: [] }

    MetodoNoPermitido:
      description: La URI existe pero no soporta ese verbo
      headers:
        Allow:
          description: Verbos que el recurso si acepta
          schema: { type: string, example: 'GET, POST, OPTIONS' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: 'El metodo PUT no esta permitido en /api/v1/vehiculos'
              details: [{ campo: Allow, mensaje: 'GET, POST, OPTIONS' }]

    MediaTypeNoSoportado:
      description: El `Content-Type` enviado no es `application/json`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: "Content-Type 'text/plain' no soportado. Se espera 'application/json'"
              details: []

    PayloadDemasiadoGrande:
      description: El cuerpo del request supera el limite de 100 kB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: El cuerpo del request supera el tamanio maximo permitido
              details: []
